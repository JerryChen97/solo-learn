defaults:
  - _self_
  - augmentations: asymmetric.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "dual_threshold_byol-cifar10-test"
method: "dual_threshold_byol"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 2048  # Reduced for faster testing
  proj_output_dim: 128   # Reduced for faster testing
  pred_hidden_dim: 512   # Reduced for faster testing
  # IOT Dual-Threshold parameters
  gamma: 1.0
  epsilon: 0.0001
  e0: 0.1
  e1: 0.9
  # EMA parameters
  base_tau_momentum: 0.99
  final_tau_momentum: 1.0
  momentum_classifier: False

data:
  dataset: cifar10
  train_path: "./datasets"
  val_path: "./datasets"
  format: "image_folder"
  num_workers: 2  # Reduced for testing

optimizer:
  name: "sgd"  # Use SGD for quick testing
  batch_size: 128  # Smaller batch for testing
  lr: 0.3
  classifier_lr: 0.1
  weight_decay: 0.00001
  exclude_bias_n_norm_wd: False
  kwargs: {}

scheduler:
  name: "warmup_cosine"
  min_lr: 0.0
  warmup_start_lr: 0.00003
  warmup_epochs: 2

checkpoint:
  enabled: False  # Disable for quick test
  dir: "trained_models"
  frequency: 1

auto_resume:
  enabled: False

# Disable wandb
wandb:
  enabled: False

# overwrite PL stuff
max_epochs: 5  # Just 5 epochs for quick test
devices: [0]
sync_batchnorm: False  # Disable for single GPU
accelerator: "gpu"
strategy: "auto"  # Auto for single GPU
precision: 32  # Use full precision for stability during testing
seed: 5
