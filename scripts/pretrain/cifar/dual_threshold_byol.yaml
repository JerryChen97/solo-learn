defaults:
  - _self_
  - augmentations: asymmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "dual_threshold_byol-cifar10"
method: "dual_threshold_byol"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 4096
  proj_output_dim: 256
  pred_hidden_dim: 4096
  # IOT Dual-Threshold parameters
  gamma: 1.0
  epsilon: 0.0001
  e0: 0.1
  e1: 0.9
  # EMA parameters
  base_tau_momentum: 0.99
  final_tau_momentum: 1.0
  momentum_classifier: False

data:
  dataset: cifar10
  train_path: "./datasets"
  val_path: "./datasets"
  format: "image_folder"
  num_workers: 4

optimizer:
  name: "lars"
  batch_size: 256
  lr: 1.0
  classifier_lr: 0.1
  weight_decay: 0.00001
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True

scheduler:
  name: "warmup_cosine"
  min_lr: 0.0
  warmup_start_lr: 0.00003
  warmup_epochs: 10

checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1

auto_resume:
  enabled: True

# overwrite PL stuff
max_epochs: 100  # Start with 100 epochs for testing
devices: [0]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16-mixed
seed: 5
