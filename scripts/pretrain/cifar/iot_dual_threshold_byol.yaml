defaults:
  - _self_
  - augmentations: asymmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "iot_dual_threshold_byol.yaml-cifar10" # change here for cifar100
method: "iot_dual_threshold_byol"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 4096
  proj_output_dim: 256
  pred_hidden_dim: 4096
  # <--- ADDED THESE PARAMS FOR YOUR NEW LOSS
  gamma: 1.0
  epsilon: 0.0001
  e0: 0.1
  e1: 0.9
momentum:
  base_tau: 0.99
  final_tau: 1.0
data:
  dataset: cifar10 # change here for cifar100
  train_path: "./datasets"
  val_path: "./datasets"
  format: "image_folder"
  num_workers: 4
optimizer:
  name: "lars"
  batch_size: 256
  lr: 1.0
  classifier_lr: 0.1
  weight_decay: 1e-5
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
auto_resume:
  enabled: True

# overwrite PL stuff
max_epochs: 1000
devices: 1
sync_batchnorm: False # Change from True to False (Batchnorm sync requires DDP/GPU)
accelerator: "cpu"   # Change from "gpu" to "cpu"
strategy: "auto"     # Change from "ddp" to "auto"
precision: 32        # Mixed precision (16) often requires GPU, switch to 32
